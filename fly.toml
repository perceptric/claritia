# The Claritia app on Fly.io (app.tryclaritia.com). The site, tryclaritia.com, is a plain HTML site on Hostinger.
#   fly deploy
app = "claritia-web"
primary_region = "nrt" # Tokyo, next to the Supabase database

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Sleeps when idle and wakes on the next visit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
