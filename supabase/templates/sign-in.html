<!doctype html>
<html>
  <body style="margin:0;background:#f4f4f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <span style="display:none;max-height:0;overflow:hidden">Your sign-in link for Claritia</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 12px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e7e7e9;border-radius:10px">
            <tr>
              <td style="padding:28px 28px 24px;color:#0a0a0a;font-size:15px;line-height:1.55">
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 20px">
                  <tr>
                    <td style="width:28px;height:28px;vertical-align:middle">
                      <img src="https://app.tryclaritia.com/apple-icon.png" width="28" height="28" alt="" style="display:block;border:0;border-radius:8px" />
                    </td>
                    <td style="padding-left:8px;font-size:16px;font-weight:600;letter-spacing:-0.02em">Claritia</td>
                  </tr>
                </table>
                <p style="margin:0 0 6px;font-size:18px;font-weight:600">Sign in to Claritia</p>
                <p style="margin:0 0 18px">Use this link to sign in. It works once and expires in an hour.</p>
                <p style="margin:0 0 18px">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#333333;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:99px;font-weight:600">Sign in</a>
                </p>
                <p style="margin:0;color:#71717a">If you didn't ask for this, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
