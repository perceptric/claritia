# Deploy to Fly.io on every push to main: the checks first (ci.yml), then each of the app, the runner, the tunnel relay,
# collect and intel whose files the push changed. A manual run deploys all five.
# Needs one repository secret, FLY_API_TOKEN (from `fly tokens create org`). Without it, the deploy steps are skipped.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push waits for the one in progress, so deploys never overlap.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  # The same checks as pull requests get: lint, types, unit tests, database tests and browser checks.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # paths: what goes into each app's image (its Dockerfile's COPY lines), as a regular expression.
        include:
          - app: claritia-web
            config: fly.toml
            paths: '^(src/|public/|next\.config\.ts|postcss\.config\.mjs|tsconfig\.json|package(-lock)?\.json|Dockerfile$|fly\.toml)'
          - app: claritia-runner
            config: fly.runner.toml
            paths: '^(worker/|src/lib/(claude|lock|planner|privateNet|seal)\.ts|package(-lock)?\.json|fly\.runner\.toml)'
          - app: claritia-relay
            config: fly.relay.toml
            paths: '^(relay/|fly\.relay\.toml)'
          - app: claritia-collect
            config: fly.collect.toml
            paths: '^(collect/|src/lib/web/|src/lib/sign\.ts|package(-lock)?\.json|fly\.collect\.toml)'
          - app: claritia-intel
            config: fly.intel.toml
            paths: '^(worker-intel/|src/lib/|package(-lock)?\.json|fly\.intel\.toml)'

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did this push change ${{ matrix.app }}?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          PATHS: ${{ matrix.paths }}
        run: |
          # A manual run, a new branch or a force push without the old commit: deploy.
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE "$PATHS"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing in ${{ matrix.app }} changed, so it isn't deployed."
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: env.FLY_API_TOKEN != '' && steps.changed.outputs.deploy == 'true'
      - name: Create ${{ matrix.app }} if it doesn't exist yet
        if: env.FLY_API_TOKEN != '' && steps.changed.outputs.deploy == 'true'
        run: flyctl status --app ${{ matrix.app }} >/dev/null 2>&1 || flyctl apps create ${{ matrix.app }}
      - name: Deploy ${{ matrix.app }}
        if: env.FLY_API_TOKEN != '' && steps.changed.outputs.deploy == 'true'
        # --ha=false: one machine per app. Fly would start two on the first deploy, which doubles the bill.
        run: flyctl deploy --remote-only --ha=false --config ${{ matrix.config }} --app ${{ matrix.app }}
      - name: No Fly token yet
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::Add the FLY_API_TOKEN repository secret to deploy ${{ matrix.app }} to Fly.io."
