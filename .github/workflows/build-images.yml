# Build each app's Docker image on every push and publish it to GitHub's container registry (ghcr.io).
# The Hostinger VPS pulls these images. Nothing deploys from here; GITHUB_TOKEN is the only secret it needs.
name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claritia-web
            file: Dockerfile
            args: ""
          - image: claritia-runner
            file: worker/Dockerfile
            args: ""
          - image: claritia-relay
            file: relay/Dockerfile
            args: ""
          - image: claritia-intel
            file: worker-intel/Dockerfile
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
